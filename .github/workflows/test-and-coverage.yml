name: Test and Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (Jest) with coverage
        run: bun run test:coverage -- --passWithNoTests

      - name: Set Codecov host (optional)
        shell: bash
        run: |
          if [ -n "${{ vars.CODECOV_URL }}" ]; then
            echo "CODECOV_URL=${{ vars.CODECOV_URL }}" >> "$GITHUB_ENV"
          else
            echo "CODECOV_URL=https://codecov.io" >> "$GITHUB_ENV"
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
