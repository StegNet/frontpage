name: Deploy Production (on tag)

# Production deploys fire ONLY on a new semver tag pushed to a commit on main.
# Disable Vercel's native production deployments for `main` so this is the single
# source of prod releases:
#   Dashboard -> Project -> Settings -> Git -> disable Production Deployments,
#   or add vercel.json: { "git": { "deploymentEnabled": { "main": false } } }

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (full history for ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate strict semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"
          # vMAJOR.MINOR.PATCH with optional -prerelease and +build metadata
          echo "$TAG" | grep -Pq '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Tag '$TAG' is not strict semver (vX.Y.Z)"; exit 1; }

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main; refusing to deploy"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Sentry release = tag)
        env:
          SENTRY_RELEASE: ${{ github.ref_name }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.ref_name }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $URL"
          echo "## Production deploy \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
