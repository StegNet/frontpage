name: Publish Docker image and Release

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.get_version.outputs.pkg_version }}
      image_repo: ${{ steps.get_version.outputs.image_repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version from package.json
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          repo_lc=${GITHUB_REPOSITORY,,}
          image="ghcr.io/${repo_lc}"
          echo "pkg_version=$version" >> "$GITHUB_OUTPUT"
          echo "image_repo=$image" >> "$GITHUB_OUTPUT"

      - name: Get last release version
        id: get_last
        run: |
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          echo "last_version=$last" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version changed
        id: check
        run: |
          if [ "${{ steps.get_version.outputs.pkg_version }}" = "${{ steps.get_last.outputs.last_version }}" ]; then
            echo "No version change. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed to ${{ steps.get_version.outputs.pkg_version }}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log into GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.check-version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ needs.check-version.outputs.image_repo }}:${{ needs.check-version.outputs.version }}
            ${{ needs.check-version.outputs.image_repo }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Release ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
