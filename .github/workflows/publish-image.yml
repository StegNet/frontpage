name: Publish Docker image and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version and image tags
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_repo=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          # Stable key so the layer-cache sticky disk is shared across every run.
          # Must NOT vary per tag/sha, or each build gets a fresh (cold) disk.
          cache-key: ${{ github.repository }}

      - name: Build and push Docker image to GHCR
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_repo }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tell Portainer to pull the freshly-pushed image tag and redeploy.
  request-update:
    needs: publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency: production
    env:
      DEPLOY_ENV: production
    steps:
      - name: Trigger Portainer redeploy webhook
        uses: newarifrh/portainer-service-webhook@v1
        with:
          webhook_url: "${{ secrets.PORTAINER_WEBHOOK }}?${{ vars.PORTAINER_DEPLOY_TAG || 'tag' }}=${{ needs.publish.outputs.version }}"

      - name: Record Sentry deploy
        run: npx @sentry/cli deploys new -e "$DEPLOY_ENV"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: stegnet
          SENTRY_PROJECT: stegnet-frontpage
          SENTRY_RELEASE: frontpage@${{ needs.publish.outputs.version }}
